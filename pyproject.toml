[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "nicheverse"
version = "0.2.0"
description = "NICHEVERSE: a world model for tissues that learns hierarchical vector-quantized codebooks of cell states and spatial niches from imaging-based spatial transcriptomics (Xenium, MERFISH, seqFISH, CosMx)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
maintainers = [
  { name = "Digvijay Yarlagadda", email = "y.digvijaykumar@gmail.com" },
]
authors = [
  { name = "Digvijay Yarlagadda" },
]
keywords = [
  "spatial-transcriptomics",
  "spatial-ecotypes",
  "cellular-niches",
  "xenium",
  "merfish",
  "cosmx",
  "seqfish",
  "world-model",
  "vq-vae",
  "single-cell",
  "anndata",
  "rcc",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.0,<3",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "scanpy>=1.10,<2",
  "anndata>=0.10,<1",
  "matplotlib>=3.7,<4",
  "pyarrow>=14",
  "h5py>=3.9,<4",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40", "requests>=2.28"]
mcp = ["mcp>=1.0"]
test = [
  "pytest>=7",
  "pytest-cov>=4",
  "coverage>=7",
]
dev = [
  "pre-commit>=3",
  "ruff>=0.4",
  "mypy>=1.6",
  "build>=1",
  "twine>=5",
]
doc = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.15",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-design",
  "myst-nb>=1",
  "sphinxext-opengraph",
  "sphinxcontrib-bibtex>=2",
  "ipykernel",
  "ipython",
]

[project.urls]
Documentation = "https://nicheverse.readthedocs.io/"
Homepage = "https://github.com/digvijayky/nicheverse"
Source = "https://github.com/digvijayky/nicheverse"
Issues = "https://github.com/digvijayky/nicheverse/issues"

[project.scripts]
nicheverse = "nicheverse.cli:main"
nicheverse-mcp = "nicheverse.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nicheverse"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:louvain.*",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::DeprecationWarning:scanpy.*",
  "ignore::UserWarning:matplotlib.projections.*",
]

[tool.coverage.run]
source = ["nicheverse"]
omit = ["**/test_*.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
  ".git",
  "build",
  "dist",
  "docs/_build",
  "src/nicheverse.egg-info",
]

[tool.ruff.lint]
select = [
  "E", "W",       # pycodestyle
  "F",            # pyflakes
  "I",            # isort
  "B",            # bugbear
  "UP",           # pyupgrade
  "N",            # pep8 naming
  "SIM",          # flake8-simplify
  "RUF",          # ruff-specific
]
ignore = [
  "E501",   # long lines (math + long names sometimes overflow)
  "N803",   # argument should be lowercase (X / Y conventional)
  "N806",   # variable in function should be lowercase
  "N812",   # `import torch.nn.functional as F` is the universal PyTorch idiom
  "B008",   # do not perform function call in argument defaults
  "RUF022", # __all__ is grouped by category with comments, not alphabetized
]

[tool.ruff.lint.per-file-ignores]
# __init__ attaches a logging NullHandler before re-exporting submodules; viz
# selects the matplotlib backend before importing pyplot. Both are intentional.
"*/__init__.py" = ["F401", "E402"]
"src/nicheverse/plotting.py" = ["E402"]
"tests/*" = ["N802", "N806", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["nicheverse"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/nicheverse"]
