name: Notify docs

# On every push to main, tell the nicheverse-docs repo to rebuild and redeploy
# so the published site (API reference + version) tracks the code.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nicheverse-docs rebuild
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.DOCS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/digvijayky/nicheverse-docs/dispatches \
            -d '{"event_type":"nicheverse-code-changed"}'
